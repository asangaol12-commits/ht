name = "ht"
main = "index.js"
compatibility_date = "2026-08-06"

[vars]
CLOUDFLARE_APP_ID = "aaa070e8-076f-4ccb-be27-7df44719ce61"

[durable_objects]
bindings = [
  { name = "SIGNALING_ROOM", class_name = "SignalingRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalingRoom"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
